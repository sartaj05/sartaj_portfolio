services:
  - type: web
    name: sartaj-portfolio
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn sartaj_portfolio.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ENV
        value: production
      - key: CONTACT_RECIPIENT
        value: sartaj.ahamad0502@gmail.com
      # Add these in the Render dashboard using a Gmail app password.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
